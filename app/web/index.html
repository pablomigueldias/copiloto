<!doctype html>
<html lang="pt-BR" data-tema="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Copiloto</title>
  <link rel="stylesheet" href="/painel.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🧭</text></svg>">
</head>
<body>

<!-- Login: o formulário é injetado pelo `sessao.js`, que é o mesmo nas duas
     páginas. Duplicá-lo aqui e em /candidaturas/ seria pedir para os dois
     divergirem no primeiro conserto feito só de um lado. -->
<div id="login" hidden></div>

<div id="painel" hidden>
  <header>
    <h1>Copiloto</h1>
    <nav class="paginas">
      <a href="/candidaturas/">candidaturas →</a>
    </nav>
    <div class="saude" id="saude"></div>
    <button class="ghost" id="atualizar" title="Atualizar agora">↻</button>
    <button class="ghost" id="sair" title="Sair">sair</button>
  </header>

  <!-- Perguntar: o copiloto v0 da F3, agora com botão. -->
  <section class="perguntar">
    <form id="form-pergunta">
      <input id="pergunta" placeholder="o que eu estudei sobre…?" autocomplete="off">
      <button type="submit" id="btn-perguntar">perguntar</button>
    </form>
    <div id="resposta" hidden></div>
  </section>

  <!-- Transcrever: ligar a gravação é o gesto que compete com "só assistir",
       então mora no topo, a um clique, e não atrás de um terminal. -->
  <section class="card largura-total" id="card-transcricao">
    <h2>
      Transcrever <span class="badge" id="transcricao-tempo" data-zero="1">•</span>
      <span class="acoes-titulo">
        <select id="fonte-audio" class="ghost" title="De onde gravar">
          <option value="sistema">áudio do sistema (vídeo/reunião)</option>
          <option value="mic">microfone (aula presencial)</option>
        </select>
        <button class="ghost" id="btn-gravar">● gravar</button>
      </span>
    </h2>

    <p class="rotulo" id="transcricao-dica">
      Ligue antes de dar play. O texto aparece aqui enquanto o vídeo roda, e no
      fim você dá nome e escolhe a pasta do Second Brain.
    </p>

    <!-- O texto ao vivo. Rola sozinho para o fim enquanto grava. -->
    <div id="transcricao-viva" hidden></div>

    <!-- A tela do fim: o modelo local sugere, eu confirmo. -->
    <form id="form-nota" hidden>
      <div class="campos-nota">
        <label>título da nota<input id="nota-titulo" required></label>
        <label>nome do arquivo<input id="nota-arquivo"></label>
        <label>tags (vírgula)<input id="nota-tags"></label>
      </div>

      <!-- A pasta era um input com datalist: só aparecia se você digitasse, e
           ninguém adivinha isso. Agora a lista está na tela. -->
      <div class="escolher-pasta">
        <div class="rotulo">
          onde salvar
          <button type="button" class="ghost" id="btn-recarregar-pastas"
                  title="acabei de criar uma pasta no Obsidian">↻ pastas</button>
        </div>
        <input id="nota-pasta" list="pastas-do-vault" placeholder="Pessoal/… (ou digite uma pasta nova)">
        <datalist id="pastas-do-vault"></datalist>
        <div class="pastas-sugeridas" id="pastas-sugeridas"></div>
      </div>

      <div id="nota-resumo" class="rotulo"></div>
      <div id="nota-corrigidos"></div>
      <div class="botoes">
        <button type="submit" class="primario">salvar no Second Brain</button>
        <button type="button" id="btn-descartar" class="ghost">descartar</button>
      </div>
    </form>
  </section>

  <main class="blocos">
    <section class="card" id="card-fila">
      <h2>Fila <span class="badge" id="fila-total">0</span></h2>
      <!-- Enquanto eu edito, a fila não é repintada. Não atualizar em silêncio
           seria trocar um bug por outro, então a tela conta. -->
      <p class="pausada" id="fila-pausada" hidden>
        atualização pausada — você está editando
        <button class="ghost" id="btn-forcar-fila">atualizar mesmo assim</button>
      </p>
      <div id="fila"></div>
    </section>

    <!-- Os dois medidores numa coluna própria, e não como itens soltos da
         grade: soltos, cada um cai numa linha cujo tamanho é ditado pela fila,
         e o "Modelo" desce para o meio da página quando a fila é alta. -->
    <div class="coluna">
      <section class="card" id="card-conhecimento">
        <h2>Conhecimento</h2>
        <div id="conhecimento"></div>
      </section>

      <section class="card" id="card-modelo">
        <h2>Modelo</h2>
        <div id="modelo"></div>
      </section>
    </div>
  </main>

  <footer id="rodape"></footer>
</div>

<!-- Módulos ES nativos, sem build: o navegador resolve os imports. Sem `?v=`
     de propósito — versionar URL não alcança os `import` de dentro do módulo;
     quem garante o JS fresco é o `no-cache` do PainelEstatico. -->
<script type="module" src="/js/main.js"></script>
</body>
</html>
