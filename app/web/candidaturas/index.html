<!doctype html>
<html lang="pt-BR" data-tema="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Candidaturas · Copiloto</title>
  <link rel="stylesheet" href="/painel.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🧭</text></svg>">
</head>
<body>

<!-- Login: injetado pelo `sessao.js`, o mesmo das duas páginas. A sessão é
     cookie, então vir do painel para cá não pede senha de novo. -->
<div id="login" hidden></div>

<div id="painel" hidden>
  <header>
    <h1>Candidaturas</h1>
    <nav class="paginas">
      <a href="/">← painel</a>
    </nav>
    <div class="saude" id="saude"></div>
    <button class="ghost" id="atualizar" title="Atualizar agora">↻</button>
    <button class="ghost" id="sair" title="Sair">sair</button>
  </header>

  <!-- A lista é o objeto principal desta página: ela ocupa o topo inteiro, e o
       funil (que é resumo) desce para o rodapé. Foi o motivo de a página
       existir — na tela única, a tabela disputava espaço com transcrição e
       fila, e ia ficar impossível de ler passando de uma dúzia de vagas. -->
  <section class="card largura-total" id="card-vagas">
    <h2>
      Candidaturas <span class="badge" id="vagas-total" data-zero="1">0</span>
      <span class="acoes-titulo">
        <input id="busca-vagas" class="ghost busca" type="search"
               placeholder="buscar…" aria-label="Buscar vaga por título, empresa ou local"
               autocomplete="off" />
        <select id="filtro-status" class="ghost" title="Filtrar por status">
          <option value="">todos os status</option>
        </select>
        <button class="ghost" id="btn-nova">+ colar vaga</button>
      </span>
    </h2>

    <!-- Colar a vaga e decidir ali mesmo o que fazer com ela. -->
    <form id="form-vaga" hidden>
      <div class="campos-vaga">
        <input id="nova-titulo" placeholder="título da vaga (opcional — sai da 1ª linha)">
        <input id="nova-empresa" placeholder="empresa">
        <input id="nova-link" placeholder="link">
      </div>
      <textarea id="nova-descricao" rows="9"
        placeholder="cole aqui a descrição inteira da vaga…"></textarea>
      <div class="botoes">
        <button type="submit" data-fluxo="salvar" class="secundario">só salvar</button>
        <button type="submit" data-fluxo="analisar">analisar</button>
        <button type="submit" data-fluxo="gerar" class="primario">analisar + gerar</button>
        <button type="button" id="btn-cancelar-vaga" class="ghost">cancelar</button>
      </div>
    </form>

    <div id="tabela-vagas"></div>
  </section>

  <main class="resumo">
    <!-- Funil e lista de estudo: dado de candidatura, então moram junto da
         tabela e não no painel. Embaixo porque são resumo — o que eu faço
         nesta tela é mexer numa vaga, não olhar a média. -->
    <section class="card" id="card-candidaturas">
      <h2>Funil</h2>
      <div id="candidaturas"></div>
    </section>
  </main>

  <footer id="rodape"></footer>
</div>

<!-- Painel lateral: entra da direita, como no Notion. Fora do #painel para
     que o backdrop cubra a tela inteira sem depender do scroll da página. -->
<div id="gaveta-fundo" hidden></div>
<aside id="gaveta" hidden aria-modal="true" role="dialog" aria-labelledby="gaveta-titulo">
  <header class="gaveta-topo">
    <div class="gaveta-identidade">
      <span class="rotulo" id="gaveta-etiqueta">Vaga</span>
      <h2 id="gaveta-titulo" contenteditable="plaintext-only" data-campo="titulo"
          spellcheck="false"></h2>
    </div>
    <button class="ghost" id="gaveta-fechar" title="Fechar (Esc)">✕</button>
  </header>
  <div class="gaveta-corpo" id="gaveta-corpo"></div>
  <!-- `Esc` desfazer é intencional, mas ninguém adivinha: sem esta linha, o
       comportamento é indistinguível de perda de dado. -->
  <footer class="gaveta-ajuda" id="gaveta-ajuda">
    clique num campo para editar · <b>Enter</b> salva · <b>Esc</b> desfaz
  </footer>
</aside>

<!-- Os caminhos são absolutos (`/js/…`): esta página mora em /candidaturas/, e
     caminho relativo procuraria os módulos em /candidaturas/js/. -->
<script type="module" src="/js/candidaturas.js"></script>
</body>
</html>
