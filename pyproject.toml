[project]
name = "copiloto"
version = "0.1.0"
description = "Assistente pessoal autônomo, local-first."
requires-python = ">=3.12"

# Uma dependência entra quando a fase que precisa dela chega — nunca antes.
# Ainda fora: python-multipart (upload), e o ecossistema de treino da F9.
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.0",
    "pydantic-settings==2.6.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",           # driver async da aplicação
    "psycopg[binary]==3.2.3",    # driver sync do Alembic
    "alembic==1.13.3",
    "argon2-cffi==23.1.0",       # hash de senha (Argon2id)
    "pgvector==0.3.6",           # tipo vector no SQLAlchemy (Fase 2)
    "httpx==0.27.2",             # cliente do Ollama (Fase 1)
    "arq==0.26.3",               # worker sobre Redis (Fase 4)
    "reportlab==4.2.5",          # PDF do currículo, ATS-friendly (Fase 5)
    # Leitura de PDF (Fase 2.6). AGPL: ok porque este sistema é pessoal e não é
    # SaaS (§16 do plano). Se um dia for, a troca é por pypdfium2.
    "pymupdf==1.24.14",
    "loguru==0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.0",
    "pytest-asyncio==1.3.0",
    "ruff",
    "coverage",
]
# Transcrição de aula/reunião (scripts/transcrever.py). Fora do núcleo porque
# arrasta ~200 MB de ctranslate2 + o peso do modelo, e o resto do sistema
# funciona sem. O tratamento do texto (`app/conhecimento/transcricao.py`) não
# depende disto — só o passo de virar áudio em letra.
transcricao = [
    "faster-whisper==1.2.1",
]
# O Whisper na GPU. Separado de `transcricao` porque são ~1,1 GB de bibliotecas
# e porque o caminho de CPU continua funcionando sem elas — máquina sem NVIDIA
# instala só o `transcricao` e cai no `int8` da CPU sozinha.
#
# O ctranslate2 abre estas duas com `dlopen` na PRIMEIRA INFERÊNCIA, não ao
# carregar o modelo: sem elas o `WhisperModel(device="cuda")` constrói normal e
# só quebra ao transcrever. `app/conhecimento/whisper.py` as carrega no processo.
transcricao-gpu = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
]
# Testes de navegador (tests/ui). Separado do `dev` porque baixa ~130 MB de
# Chromium e porque a suíte padrão não depende dele — ver docs/fase06.md §E1.
#   pip install -e ".[dev,ui]" && playwright install chromium
ui = [
    "playwright==1.58.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ── Lint ──────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
#   F  pyflakes · E,W pycodestyle · I isort · B bugbear · UP pyupgrade
select = ["F", "E", "W", "I", "B", "UP"]
ignore = ["E501"]  # prompts longos em pt-BR

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ── Testes ────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
# Os testes de navegador ficam de fora do `pytest` puro: sobem um uvicorn e um
# Chromium, e levam ~30 s. Rode-os de propósito com `pytest -m ui` quando mexer
# no front — ver docs/fase06.md §E1.
addopts = "-q -p no:cacheprovider -m 'not ui'"
markers = [
    "ui: teste de navegador (precisa de `pip install -e '.[ui]'` + playwright install chromium)",
]
asyncio_mode = "auto"
# Um único event loop para a suíte inteira. O engine do SQLAlchemy é singleton
# de módulo e seu pool fica preso ao loop que o criou — com loop por teste, o
# asyncpg quebra com "attached to a different loop" no 2º teste.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
